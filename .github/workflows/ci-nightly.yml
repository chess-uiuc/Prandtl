name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC nightly
  workflow_dispatch:

jobs:
  nightly:
    name: Ubuntu/MPICH/GCC/Coverage/Examples
    runs-on: ubuntu-22.04
    env:
      CMAKE_BUILD_TYPE: Debug
      INSTALL_PREFIX: ${{ github.workspace }}/deps
      PYVISTA_OFF_SCREEN: "true"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show submodule SHAs (debug)
        run: git submodule status --recursive

      - name: Install toolchain and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 gfortran-12 libgl1 libegl1 \
            mpich libmpich-dev environment-modules \
            cmake ninja-build pkg-config ccache \
            gcovr jq
          echo "CC=mpicc"   >> $GITHUB_ENV
          echo "CXX=mpicxx" >> $GITHUB_ENV
          echo "FC=mpifort" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-resources/requirements-ci.txt

      - name: Locate MFEM submodule
        id: mfemloc
        shell: bash
        run: |
          set -euo pipefail
          MFEM_SRC=""
          for d in libs/mfem external/mfem third_party/mfem mfem submodules/mfem; do
            if [[ -d "$d" ]]; then MFEM_SRC="$d"; break; fi
          done
          if [[ -z "$MFEM_SRC" ]]; then
            echo "ERROR: Could not find MFEM submodule. Expected one of: libs/mfem, external/mfem, third_party/mfem, mfem, submodules/mfem" >&2
            exit 1
          fi
          echo "MFEM_SRC=$MFEM_SRC" | tee -a $GITHUB_ENV
          echo "MFEM_DIR=${GITHUB_WORKSPACE}/libs/mfem/build" | tee -a $GITHUB_ENV

      - name: Build dependency submodules (HYPRE, METIS, MFEM)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /etc/profile.d/modules.sh ]; then
            source /etc/profile.d/modules.sh
          else
            module() { return 0; }
            export -f module
          fi
          bash ./build_depends.sh

      - name: Show built dependency libs (debug)
        if: always()
        run: |
          ls -lh libs/mfem/* 2>/dev/null || true
          ls -lh libs/mfem/*/libmfem* 2>/dev/null || true
          ls -lh libs/hypre/src/hypre/lib 2>/dev/null || true
          ls -lh libs/metis-5.1.0/lib 2>/dev/null || true

      - name: Configure Prandtl (Euler, coverage flags)
        env:
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}
          FC: ${{ env.FC }}
          MFEM_DIR: ${{ env.MFEM_DIR }}
        run: |
          mkdir -p build-euler
          cmake -S . -B build-euler -G Ninja \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH=${MFEM_DIR} \
            -DSUBCELL_FV_BLENDING=ON \
            -DNO_OPT=ON \
            -DCMAKE_C_FLAGS="--coverage" \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build Prandtl (Euler)
        run: cmake --build build-euler -- -k 0

      - name: Configure Prandtl (CNS, coverage flags)
        env:
          CC: ${{ env.CC }}
          CXX: ${{ env.CXX }}
          FC: ${{ env.FC }}
          MFEM_DIR: ${{ env.MFEM_DIR }}
        run: |
          mkdir -p build-cns
          cmake -S . -B build-cns -G Ninja \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH=${MFEM_DIR} \
            -DPARABOLIC=ON \
            -DSUBCELL_FV_BLENDING=ON \
            -DNO_OPT=ON \
            -DCMAKE_C_FLAGS="--coverage" \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build Prandtl (CNS)
        run: cmake --build build-cns -- -k 0

      - name: CTest (Euler)
        run: ctest --test-dir build-euler -L "(unit|smoke|mpi|integration)" -j2 --output-on-failure

      - name: CTest (CNS)
        run: ctest --test-dir build-cns -L "(unit|smoke|mpi|integration)" -j2 --output-on-failure

      - name: Nightly example sweep (Euler)
        run: |
          cat > examples-nightly-euler.txt <<'EOF'
          TestCases/Euler/1D/Problem123/config.json
          TestCases/Euler/1D/ShuOsherShock/config.json
          TestCases/Euler/1D/SodShockTube/config.json
          TestCases/Euler/1D/WoodwardColellaBlastWave/config.json
          TestCases/Euler/1D/WoodwardColellaBlastWaveCollision/config.json
          TestCases/Euler/1D/WoodwardColellaBlastWaveLeft/config.json
          TestCases/Euler/1D/WoodwardColellaBlastWaveRight/config.json
          TestCases/Euler/1D/AcousticWave/config.json
          TestCases/Euler/1D/LaxShockTube/config.json
          TestCases/Euler/1D/LeBlancShockTube/config.json
          TestCases/Euler/1D/ModifiedSodShockTube/config.json
          TestCases/Euler/2D/ForwardFacingStep/config.json
          TestCases/Euler/2D/IsentropicVortex/config.json
          TestCases/Euler/2D/KelvinHelmholtzInstability/config.json
          TestCases/Euler/2D/Nagashima_Ramjet/TR0/config.json
          TestCases/Euler/2D/Ramp/config.json
          TestCases/Euler/2D/BackwardFacingStep/config.json
          TestCases/Euler/2D/TriplePointShockInteraction/config.json
          EOF
          scripts/test_run_example.sh \
            -b "$(pwd)/build-euler" \
            -l examples-nightly-euler.txt \
            -n 200

      - name: Nightly example sweep (CNS)
        run: |
          cat > examples-nightly-cns.txt <<'EOF'
          TestCases/NavierStokes/2D/LidDrivenCavity/config.json
          TestCases/NavierStokes/2D/TaylorGreenVortex/config.json
          EOF
          scripts/test_run_example.sh \
            -b "$(pwd)/build-cns" \
            -l examples-nightly-cns.txt \
            -n 200

      - name: Coverage (gcovr XML + HTML)
        run: |
          mkdir -p coverage
          gcovr -r . \
            --xml -o coverage/coverage.xml \
            --html --html-details -o coverage/index.html \
            --exclude-directories 'libs/.*' \
            build-euler build-cns

      - name: Upload coverage & logs & outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prandtl-nightly
          path: |
            coverage/**
            build-euler/Testing/**/Test.xml
            build-euler/CMakeCache.txt
            build-euler/**/*.log
            build-cns/Testing/**/Test.xml
            build-cns/CMakeCache.txt
            build-cns/**/*.log
            RegressionTests
            RunTests
            Run1
            Run2